repos:
  #
  # General file hygiene
  #
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files

  #
  # C/C++ formatting
  #
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        files: \.(c|cc|cpp|cxx|h|hpp|hh)$

  #
  # CMake formatting
  #
  - repo: https://github.com/cheshirekow/cmake_format
    rev: 0.6.13
    hooks:
      - id: cmake-format
      - id: cmake-lint

  #
  # YAML formatting
  #
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types:
          - yaml

  #
  # Local project hooks
  #
  - repo: local
    hooks:

      - id: clang-tidy
        name: clang-tidy
        entry: clang-tidy
        language: system
        pass_filenames: true
        files: \.(cpp|cc|cxx)$

      - id: ctest
        name: Run Unit Tests
        entry: ctest --output-on-failure
        language: system
        pass_filenames: false
        stages:
          - pre-push